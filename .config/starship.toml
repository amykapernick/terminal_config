"""

# Username
[username]
show_always = false
style_user = "#318ce7 bold"
style_root = "#e53f51 bold"

# Hostname (SSH only)
[hostname]
ssh_only = true
style = "#9440a0"
ssh_symbol = " "

# Current directory
[directory]
truncation_length = 3
style = "#9B8ADC bold"
read_only = "󰌾"

# Git branch
[git_branch]
symbol = " "          # Nerd Font branch
style = "#D976AF bold"

# Git state (rebase/merge)
[git_state]
rebase = "REBASING"
merge = "MERGING"
style = "#f78d2b"

# Python version
[python]
format = "[$symbol($version )]($style)"
symbol = " "                           # Python icon
style = "white on #ffce03 bold"

# Ruby version
[ruby]
format = "[$symbol($version )]($style)"
symbol = "\uE73E "                      # Ruby icon
style = "white on #cb5699 bold"

# Package manager (npm/yarn)
[package]
format = "[$symbol($version )]($style)"
symbol = "󰏗 "                           # Box/package icon
style = "#318ce7 bold"

# Docker
[docker_context]
format = "[$symbol($version )]($style)"
symbol = " "                           # Docker whale
style = "white on #318ce7 bold"
disabled = false

# Python virtual environment
[custom.venv]
command = "basename \"$VIRTUAL_ENV\""
when = "[[ -n \"$VIRTUAL_ENV\" ]]"
format = "[$symbol($name )]($style)"
symbol = "\uE73D "                    # Virtualenv icon
style = "white on #ffce03 bold"
disabled = false

# Git metrics
[git_metrics]
format = '([▴$added]($added_style)) ([▿$deleted]($deleted_style)) '
added_style = 'italic #64ad66'
deleted_style = 'italic #e53f51'
ignore_submodules = true
disabled = false

# Git status
[git_status]
style = "bold italic #318ce7"
format = "([⎪$ahead_behind$staged$modified$untracked$renamed$deleted$conflicted$stashed⎥]($style)) "
conflicted = "◪◦"
ahead = "▴│[${count}]│"
behind = "▿│[${count}]│"
diverged = "◇ ▴┤[${ahead_count}]│▿┤[${behind_count}]│"
untracked = "◌◦"
stashed = "◃◈"
modified = "●◦"
staged = "▪┤[${count}]│"
renamed = "◎◦"
deleted = "✕"

# Jobs
[jobs]
symbol = "\u2699 " # ⚙
style = "#64ad66"

# Battery
[battery]
full_symbol = ""                                  # Battery full
charging_symbol = "󰂉"
discharging_symbol = "󰂍"
format = "[$symbol$percentage](white on #318ce7) "
disabled = false

# Command duration (shows if >5s)
[cmd_duration]
min_time = 5000
style = "bold #ffce03"

# Time
[time]
disabled = false
format = "[$time]($style)"
time_format = "%I:%M %p"
style = "#9440a0"

# Prompt character
[character]
success_symbol = "➜ "
error_symbol = " "
vicmd_symbol = "❮ "
format = "[$success_symbol](bold #64ad66) [$error_symbol](bold #e53f51) "

